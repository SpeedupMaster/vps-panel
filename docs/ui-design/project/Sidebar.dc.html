<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>侧边栏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:100%; box-sizing:border-box; padding:20px 12px; display:flex; flex-direction:column; gap:20px; font-family:Inter,'Noto Sans SC',system-ui,sans-serif; color:#1f2225; font-size:14px">
  <a href="Main.dc.html" style="display:flex; align-items:center; gap:10px; padding:0 8px; text-decoration:none; color:#1f2225">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0f7b45"></rect><path d="M7 17h4l3-7 4 12 3-5h4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span style="display:flex; flex-direction:column; line-height:1.3">
      <span style="font-weight:700; font-size:15px">VPS Panel</span>
      <span style="font-size:12px; color:#5f6368">自用节点管理</span>
    </span>
  </a>
  <nav aria-label="主导航" style="display:flex; flex-wrap:wrap; gap:4px">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="9">
      <a href="{{item.href}}" aria-current="{{item.current}}" style="flex:1 1 160px; box-sizing:border-box; display:flex; align-items:center; gap:10px; min-height:40px; padding:0 12px; border-radius:6px; text-decoration:none; font-size:14px; background:{{item.bg}}; color:{{item.fg}}; font-weight:{{item.fw}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
        <span style="flex:1">{{item.label}}</span>
        <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{false}}">
          <span style="min-width:20px; height:20px; padding:0 6px; box-sizing:border-box; border-radius:10px; background:#b4233a; color:#fff; font-size:12px; font-weight:600; display:inline-flex; align-items:center; justify-content:center">{{item.badge}}</span>
        </sc-if>
      </a>
    </sc-for>
  </nav>
  <div style="padding:12px; border-radius:6px; background:#f4f5f7; display:flex; flex-direction:column; gap:4px; font-size:12px; color:#5f6368">
    <span>面板 v0.1.0</span>
    <span>部署于 PANEL · 法兰克福</span>
    <a href="Login.dc.html" style="margin-top:6px; font-size:13px; color:#0f7b45">退出登录</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","routes","topology","latency","subscription","updates","alerts","tools","settings"],"default":"overview"},"$preview":{"width":220,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const defs = [
      ['overview', '总览', 'Main.dc.html', 'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z'],
      ['routes', '线路', 'Routes.dc.html', 'M4 7h12 M13 4l3 3-3 3 M20 17H8 M11 14l-3 3 3 3'],
      ['topology', '拓扑', 'Topology.dc.html', 'M10 5a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M3 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M17 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M12 7v5 M12 12l-6.5 5.5 M12 12l6.5 5.5'],
      ['latency', '延迟', 'Latency.dc.html', 'M3 12h4l3-8 4 16 3-8h4'],
      ['subscription', '订阅', 'Subscription.dc.html', 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1 M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1'],
      ['updates', '更新中心', 'Updates.dc.html', 'M20 12a8 8 0 1 1-2.3-5.7 M20 4v5h-5'],
      ['alerts', '告警', 'Alerts.dc.html', 'M6 16V11a6 6 0 0 1 12 0v5l2 2H4z M10 20a2 2 0 0 0 4 0'],
      ['tools', '工具', 'Tools.dc.html', 'M15 4a5 5 0 0 0-4.6 6.9L4 17.3V20h2.7l6.4-6.4A5 5 0 0 0 20 9l-3 3-3-1-1-3z'],
      ['settings', '设置', 'Settings.dc.html', 'M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9L7 7 M17 17l2.1 2.1 M4.9 19.1L7 17 M17 7l2.1-2.1']
    ];
    const items = defs.map(([id, label, href, d]) => {
      const on = id === active;
      return {
        label, href, d,
        current: on ? 'page' : 'false',
        bg: on ? '#e6f4ec' : 'transparent',
        fg: on ? '#0f7b45' : '#3d4248',
        fw: on ? '600' : '500',
        hasBadge: id === 'alerts',
        badge: '3'
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
