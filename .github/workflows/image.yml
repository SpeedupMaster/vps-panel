name: image

# Runs web & Go quality gates, then builds the linux/amd64 panel image
# and pushes it to GitHub Container Registry:
#   main       -> ghcr.io/<owner>/vps-panel:latest
#   tag v1.2.3 -> ghcr.io/<owner>/vps-panel:1.2.3, :latest
# After pushing, prunes untagged and non-release/non-latest package versions.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Corepack and pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/node/corepack
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/package.json', 'web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install, build, and test web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --if-present test

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test Go
        run: |
          go vet ./...
          go test -race -count=1 ./...

  build:
    needs: [test]
    runs-on: ubuntu-latest
    concurrency:
      group: image-publish-${{ github.event_name == 'pull_request' && github.ref || 'registry' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - id: ver
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || steps.ver.outputs.is_release == 'true')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vps-panel
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.is_release == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || steps.ver.outputs.is_release == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune non-release and untagged GHCR versions
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || steps.ver.outputs.is_release == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: vps-panel
        run: |
          set -euo pipefail
          OWNER_TYPE=$(gh api "/users/${OWNER}" --jq '.type')
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            API_BASE="/orgs/${OWNER}/packages/container/${PACKAGE}/versions"
          else
            API_BASE="/users/${OWNER}/packages/container/${PACKAGE}/versions"
          fi

          for pass in 1 2; do
            VERSIONS=$(gh api --paginate "${API_BASE}?per_page=100" | jq -s 'add // []')
            TO_DELETE=$(echo "${VERSIONS}" | jq -r '
              .[]
              | select(
                  ((.metadata.container.tags // [])
                    | any(. == "latest" or test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
                  ) | not
                )
              | "\(.id)\t\((.metadata.container.tags // []) | join(","))"
            ')
            if [ -z "${TO_DELETE}" ]; then
              echo "Pass ${pass}: no obsolete package versions found."
              break
            fi
            FAILED=0
            while IFS=$'\t' read -r vid vtags; do
              [ -z "${vid}" ] && continue
              echo "Pass ${pass}: deleting package version ${vid} (tags: ${vtags:-<untagged>})"
              if ! gh api -X DELETE "${API_BASE}/${vid}"; then
                if [ "${pass}" -eq 2 ]; then
                  echo "::error::Pass ${pass}: failed to delete version ${vid}"
                  exit 1
                fi
                echo "::warning::Pass ${pass}: failed to delete version ${vid}, will retry on pass 2"
                FAILED=1
              fi
            done <<< "${TO_DELETE}"
            if [ "${FAILED}" -eq 0 ]; then
              break
            fi
          done

          echo "Remaining package versions:"
          gh api --paginate "${API_BASE}?per_page=100" | jq -s -r '
            (add // [])[] | "  id=\(.id) digest=\(.name) tags=\((.metadata.container.tags // []) | join(","))"
          '
